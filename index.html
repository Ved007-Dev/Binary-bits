<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Indoor AR Nav</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* Modern, minimal UI layered over the camera */
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            /* Lets clicks pass through to the AR layer if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-bar,
        .bottom-bar {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            padding: 15px;
            border-radius: 12px;
            color: white;
            pointer-events: auto;
        }

        select,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #222;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #00ffcc;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        h2,
        h3 {
            margin: 0 0 10px 0;
            text-align: center;
        }

        #instruction {
            color: #00ffcc;
            font-size: 24px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div class="top-bar">
            <h2>Indoor Navigator</h2>
            <label>Start: Main Entrance</label>
            <select id="destination">
                <option value="none">Select Destination...</option>
                <option value="washroom">Washroom</option>
                <option value="library">Library</option>
                <option value="seminarhall">Seminar Hall</option>
                <option value="deanoffice">Dean's Office</option>
            </select>
            <button onclick="startNavigation()">Navigate</button>
        </div>

        <div class="bottom-bar">
            <div id="instruction">Waiting for destination...</div>
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-entity id="nav-arrow" position="0 0 -3" rotation="0 0 0" visible="false">
            <a-cylinder position="0 0.75 0" radius="0.2" height="1.5" color="#00ffcc"
                material="emissive: #00ffcc; emissiveIntensity: 0.8"></a-cylinder>
            <a-cone position="0 2.0 0" radius-bottom="0.5" height="1" color="#00ffcc"
                material="emissive: #00ffcc; emissiveIntensity: 0.8"></a-cone>
        </a-entity>

        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        // Simple routing logic for a rectangular building
        const routes = {
            washroom: { instruction: "Go Straight, then right", rotation: "-90 -90 0" }, // Arrow pointing right
            library: { instruction: "Go Straight down the hall", rotation: "-90 0 0" }, // Arrow pointing forward
            seminarhall: { instruction: "Turn Left immediately", rotation: "-90 90 0" }, // Arrow pointing left
            deanoffice: { instruction: "Go Straight, then left at the end", rotation: "-90 0 0" } // Arrow pointing forward
        };

        function startNavigation() {
            const dest = document.getElementById("destination").value;
            const instructionText = document.getElementById("instruction");
            const arrow = document.getElementById("nav-arrow");

            if (dest === "none") {
                instructionText.innerText = "Please select a destination.";
                arrow.setAttribute("visible", "false");
                return;
            }

            // Get the route data
            const routeData = routes[dest];
            if (!routeData) {
                instructionText.innerText = "Selected destination is unavailable.";
                arrow.setAttribute("visible", "false");
                return;
            }

            // Update UI
            instructionText.innerText = routeData.instruction;

            // Show and rotate the AR arrow
            arrow.setAttribute("visible", "true");

            // Note: In A-Frame, rotating the arrow changes where it points relative to the camera
            // We rotate it 90 degrees on the X axis so it lays flat, and then adjust the Y/Z to point it.
            arrow.setAttribute("rotation", routeData.rotation);

            // Add a simple bobbing animation to make it look active
            arrow.setAttribute("animation", "property: position; from: 0 0 -3; to: 0 0.5 -3; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true");
        }
    </script>
</body>

</html>
